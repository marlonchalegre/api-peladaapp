name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    env:
      PELADA_API_SECURITY_SIGNING_KEY: dummy-secret-for-testing-in-ci
      DATABASE_URL: postgres://pelada:pelada_pass@localhost:5432/peladaapp_test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pelada
          POSTGRES_PASSWORD: pelada_pass
          POSTGRES_DB: peladaapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13
        with:
          lein: 'latest'
          clj-kondo: 'latest'

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Lint
        run: |
          clj-kondo --lint src --format json > lint-results.json || true
          # Also run regular lint for console output
          clj-kondo --lint src

      - name: Lein Check
        run: lein check

      - name: Run Tests
        run: |
          set -o pipefail
          lein cloverage --text | tee test-output.txt

      - name: Generate Summary
        if: always()
        id: summary
        run: |
          SUMMARY="### 📊 Test & Lint Summary (API)
          
          | Category | Status | Details |
          | :--- | :--- | :--- |"
          
          # Lint Summary
          LINT_STATUS="❓ Unknown"
          LINT_DETAILS="N/A"
          if [ -f lint-results.json ]; then
            ERROR_COUNT=$(jq '.summary.error // 0' lint-results.json)
            WARNING_COUNT=$(jq '.summary.warning // 0' lint-results.json)
            if [ "$ERROR_COUNT" -eq "0" ] && [ "$WARNING_COUNT" -eq "0" ]; then
              LINT_STATUS="✅ Clean"
              LINT_DETAILS="No issues found"
            else
              LINT_STATUS="⚠️ Issues"
              [ "$ERROR_COUNT" -gt "0" ] && LINT_STATUS="❌ Errors"
              LINT_DETAILS="$ERROR_COUNT errors, $WARNING_COUNT warnings"
            fi
          fi
          SUMMARY="$SUMMARY
          | 🔍 Linting | $LINT_STATUS | $LINT_DETAILS |"
          
          # Test Summary
          TEST_STATUS="❓ Unknown"
          TEST_DETAILS="N/A"
          if [ -f test-output.txt ]; then
            TEST_SUMMARY_LINE1=$(grep "Ran.*tests containing.*assertions" test-output.txt | tail -n 1)
            TEST_SUMMARY_LINE2=$(grep -A 1 "Ran.*tests containing.*assertions" test-output.txt | tail -n 1)
            
            if [ -n "$TEST_SUMMARY_LINE1" ]; then
              if echo "$TEST_SUMMARY_LINE2" | grep -q "0 failures, 0 errors"; then
                TEST_STATUS="✅ Passed"
              else
                TEST_STATUS="❌ Failed"
              fi
              TEST_DETAILS="$TEST_SUMMARY_LINE1 $TEST_SUMMARY_LINE2"
            fi
          fi
          SUMMARY="$SUMMARY
          | 🧪 Tests | $TEST_STATUS | $TEST_DETAILS |"

          # Coverage Summary
          COVERAGE_STATUS="❓ Unknown"
          COVERAGE_DETAILS="N/A"
          if [ -f test-output.txt ]; then
            PCT=$(grep "ALL FILES" test-output.txt | awk -F'|' '{print $4}' | xargs)
            if [ -n "$PCT" ]; then
              COVERAGE_DETAILS="Lines: $PCT%"
              if [ "$(echo "$PCT > 80" | awk '{print ($1 > 80)}')" -eq "1" ]; then
                COVERAGE_STATUS="✅ Good"
              elif [ "$(echo "$PCT > 50" | awk '{print ($1 > 50)}')" -eq "1" ]; then
                COVERAGE_STATUS="⚠️ Fair"
              else
                COVERAGE_STATUS="❌ Poor"
              fi
            fi
          fi
          SUMMARY="$SUMMARY
          | 📈 Coverage | $COVERAGE_STATUS | $COVERAGE_DETAILS |"
          
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          
          # Export for PR comment
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message: ${{ steps.summary.outputs.content }}
          message-id: api-test-lint-summary
          allow-repeats: false

  build-and-push:
    name: Build Image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Update Cluster
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Kubernetes
        id: deploy
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository }}:latest
          KUBECONFIG: ~/.kube/config
        continue-on-error: true
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl rollout restart deployment/backend -n peladaapp
          kubectl rollout status deployment/backend -n peladaapp --timeout=90s

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Deployment Summary (API)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Status | Namespace |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "| 🚢 deployment/backend | ✅ Rolled out | peladaapp |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🚢 deployment/backend | ❌ Failed/Timeout | peladaapp |" >> $GITHUB_STEP_SUMMARY
          fi
