name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    env:
      PELADA_API_SECURITY_SIGNING_KEY: dummy-secret-for-testing-in-ci
      DATABASE_URL: postgres://pelada:pelada_pass@localhost:5432/peladaapp_test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pelada
          POSTGRES_PASSWORD: pelada_pass
          POSTGRES_DB: peladaapp_test
        ports:
          - 5432:5432
        # Wait for postgres to be ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: 'latest'
          clj-kondo: 'latest'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Lint
        run: clj-kondo --lint src

      - name: Lein Check
        run: lein check

      - name: Run Tests
        run: lein test
